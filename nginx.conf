server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/xml font/ttf application/x-font-ttf;
    gzip_min_length 512;

    # Dil kökü olmadan verilen İngilizce kısa yollar
    location = /privacy { return 301 /en/privacy; }
    location = /terms { return 301 /en/terms; }
    location = /support { return 301 /en/support; }
    location = /delete-account { return 301 /en/delete-account; }
    location = /cookies { return 301 /en/cookies; }
    location = /en { return 301 /en/; }
    location = /en/personal-data { return 301 /en/kvkk; }
    location = /tr { return 301 /; }
    location ^~ /tr/ { rewrite ^/tr/(.*)$ /$1 permanent; }

    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /en/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=300";
        error_page 404 /en/404.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=300";
        error_page 404 /404.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location = /404.html { internal; include /etc/nginx/snippets/headers.conf; }
    location = /en/404.html { internal; include /etc/nginx/snippets/headers.conf; }
}
